<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sky color="black"></a-sky>
      <a-sphere  position="1.4 1.4 -3" radius="0.5" rotation="90 -90 0" height="5" size="100"  theta-start="90" theta-length="90" side="double" color="#FFC65D"></a-sphere>
      <a-sphere  position="1 1 -3" rotation="0 90 0" radius="0.5" height="5" size="100"  theta-start="90" theta-length="90" side="double" color="#FFC65D"></a-sphere>
    </a-scene>
  </body>
</html>
